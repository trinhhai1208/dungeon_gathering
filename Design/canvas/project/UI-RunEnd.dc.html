<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Run kết thúc</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&amp;family=Tiny5&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#efe6dc}a:hover{color:#f2b33d}
img{image-rendering:pixelated}
.f-dark,.f-dark-s,.f-mid,.f-mid-s,.f-light,.f-light-s,.f-btn,.f-btn-s,.f-slot{border-style:solid;image-rendering:pixelated;box-sizing:border-box}
.f-dark{border-width:24px;border-image:url(/_blob/024dff5380443d6487e6f7e32a22dcf1) 24 fill / 24px stretch}
.f-dark-s{border-width:12px;border-image:url(/_blob/024dff5380443d6487e6f7e32a22dcf1) 24 fill / 12px stretch}
.f-mid-s{border-width:12px;border-image:url(/_blob/98548f07bfaec0e750207463097f3048) 24 fill / 12px stretch}
.f-light{border-width:24px;border-image:url(/_blob/7d20ff926ea413b147f7dfb810cee5cd) 24 fill / 24px stretch}
.f-light-s{border-width:12px;border-image:url(/_blob/7d20ff926ea413b147f7dfb810cee5cd) 24 fill / 12px stretch}
.f-btn{border-width:24px;border-image:url(/_blob/3fa1daebff64e0db2fa846fc67ed87d9) 24 fill / 24px stretch}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #1b1420; color: #efe6dc; font-family: {{font}}">
  <img src="/_blob/69fd3e2b12de9cb7b73fc309d4feed9c" alt="" style="position: absolute; left: 40px; top: -96px; width: 1200px; height: 912px; opacity: 0.3">
  <div style="position: absolute; inset: 0; background: rgba(27,20,32,0.7)"></div>

  <div style="position: absolute; left: 0; right: 0; top: 36px; display: flex; flex-direction: column; align-items: center; gap: 8px">
    <div style="font-size: 18px; letter-spacing: 4px; color: #ff8a84">{{tx.end_over}}</div>
    <h1 style="margin: 0; font-size: 72px; line-height: 1; color: #efe6dc; text-shadow: 0 5px 0 #5a1d24">{{tx.end_fallen}}</h1>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 16px; color: #d9cdd6"><img src="/_blob/b50617b22063bee244721d67b9d1c2e9" alt="" style="height: 36px">{{tx.end_killed_by}} <b style="color: #ff8a84">Vampire Lord</b> · Phase 2</div>
  </div>

  <div style="position: absolute; left: 100px; right: 100px; top: 214px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px">
    <div class="f-dark" style="padding: 4px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
          <div class="f-mid-s" style="display: flex; flex-direction: column; gap: 2px; padding: 2px 4px; color: #1b1420">
            <div style="font-size: 13px">{{s.k}}</div>
            <div style="font-size: 28px">{{s.v}}</div>
          </div>
        </sc-for>
      </div>
      <div class="f-light-s" style="align-self: flex-start; padding: 0 8px; font-size: 14px; color: #1b1420">{{tx.end_record}}</div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: #e6e9f2">{{tx.end_found}}</div>
        <div style="display: flex; gap: 8px">
          <img src="/_blob/c23b64f4ab8221b90c0a1070dbee108c" alt="{{tx.sword_iron}} F" style="width: 72px">
          <img src="/_blob/b7309a422bec545deda9d4104492539e" alt="{{tx.sword_ice}} B" style="width: 72px">
          <img src="/_blob/8754d4b075f4006a02c3a5d853d5d553" alt="{{tx.sword_void}} A" style="width: 72px">
          <img src="/_blob/c53749c8a73f92a192d18c89bebe71e4" alt="{{tx.item_fire_armor}} A {{tx.end_new}}" style="width: 72px">
          <img src="/_blob/3b2479ad5a3406938c4332bace4c62e7" alt="{{tx.item_night_gloves}} A" style="width: 72px">
          <img src="/_blob/d74730072c3d826fbcbf102a822c8485" alt="{{tx.item_rune_book}} B" style="width: 72px">
        </div>
      </div>
    </div>
    <div class="f-dark" style="padding: 4px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: #e6e9f2">{{tx.end_coin_back}}</div>
      <sc-for list="{{conv}}" as="c" hint-placeholder-count="3">
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 15px">
          <span style="display: flex; align-items: center; gap: 10px"><img src="{{c.icon}}" alt="" style="height: 26px; width: 26px; object-fit: contain">{{c.k}}</span>
          <span style="font-size: 20px">{{c.v}}</span>
        </div>
      </sc-for>
      <div class="f-mid-s" style="display: flex; justify-content: space-between; align-items: center; padding: 0 6px; margin-top: auto; color: #1b1420">
        <span style="font-size: 16px">{{tx.common_total}}</span>
        <span style="display: flex; align-items: center; gap: 8px; font-size: 34px"><img src="/_blob/0f6ec1698dc6971c0a7fbf24da9d3abe" alt="" style="height: 30px">+57</span>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 30px; display: flex; justify-content: center; gap: 20px">
    <a href="UI-Lobby.dc.html" class="f-btn" style="display: flex; align-items: center; gap: 10px; height: 76px; padding: 0 12px; color: #1b1420; text-decoration: none; font-size: 24px">{{tx.common_to_lobby}}</a>
    <a href="UI-HUD.dc.html" class="f-light" style="display: flex; align-items: center; gap: 10px; height: 76px; padding: 0 12px; color: #1b1420; text-decoration: none; font-size: 24px">{{tx.common_retry}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["en","vi"],"default":"en"},"$preview":{"width":1280,"height":720}}'>
const STR = { "common_retry": [ "RETRY", "CHƠI LẠI" ], "common_to_lobby": [ "TO LOBBY", "VỀ SẢNH" ], "common_total": [ "Total", "Tổng nhận" ], "end_coin_back": [ "Coins brought to lobby", "Coin mang về sảnh" ], "end_conv_boss": [ "Boss damage dealt", "Gây sát thương Boss" ], "end_conv_floor": [ "Floor bonus (1 floor × 20)", "Thưởng tầng (1 tầng × 20)" ], "end_conv_run": [ "Run coins 312 × 10%", "Coin gom trong run 312 × 10%" ], "end_fallen": [ "YOU HAVE FALLEN", "BẠN ĐÃ GỤC NGÃ" ], "end_found": [ "Weapons & gear found (saved to collection)", "Vũ khí & trang bị khám phá (lưu vào bộ sưu tập)" ], "end_killed_by": [ "Killed by", "Bị hạ bởi" ], "end_new": [ "(new)", "(mới)" ], "end_over": [ "RUN OVER", "RUN KẾT THÚC" ], "end_record": [ "NEW RECORD · Floor 1-5", "KỶ LỤC MỚI · Tầng 1-5" ], "item_fire_armor": [ "Flame Knight Armor", "Giáp Lửa Kỵ Sĩ" ], "item_night_gloves": [ "Nightshade Gloves", "Găng Tay Bóng Đêm" ], "item_rune_book": [ "Ancient Rune Book", "Sách Cổ Ngữ" ], "stat_floor": [ "Floor", "Tầng" ], "stat_kills": [ "Kills", "Hạ quái" ], "stat_rooms": [ "Rooms cleared", "Phòng clear" ], "stat_time": [ "Time", "Thời gian" ], "sword_ice": [ "Frost Sword", "Kiếm Băng" ], "sword_iron": [ "Iron Sword", "Kiếm Sắt" ], "sword_void": [ "Void Sword", "Kiếm Hư Không" ] };
class Component extends DCLogic {
  componentDidMount() {
    this._dgLang = () => this.forceUpdate();
    window.addEventListener('storage', this._dgLang);
    window.addEventListener('dg-lang', this._dgLang);
  }
  componentWillUnmount() {
    window.removeEventListener('storage', this._dgLang);
    window.removeEventListener('dg-lang', this._dgLang);
  }
  lang() {
    let v = null;
    try { v = window.localStorage.getItem('dg-lang'); } catch (e) {}
    return v === 'vi' || v === 'en' ? v : (this.props.lang === 'vi' ? 'vi' : 'en');
  }
  setLang(v) {
    try { window.localStorage.setItem('dg-lang', v); } catch (e) {}
    try { window.dispatchEvent(new Event('dg-lang')); } catch (e) {}
    this.forceUpdate();
  }
  font() { return this.lang() === 'vi' ? "'Tiny5', monospace" : "'Pixelify Sans', monospace"; }
  strs() {
    const i = this.lang() === 'vi' ? 1 : 0, o = {};
    Object.keys(STR).forEach(k => { o[k] = STR[k][i]; });
    return o;
  }

  renderVals() {
    const S = this.strs();
    return { tx: S, font: this.font(),
      stats: [ { k: S.stat_floor, v: '1-5' }, { k: S.stat_time, v: '11:08' }, { k: S.stat_kills, v: '41' }, { k: S.stat_rooms, v: '6' } ],
      conv: [
        { k: S.end_conv_run, v: '+31', icon: '/_blob/0f6ec1698dc6971c0a7fbf24da9d3abe' },
        { k: S.end_conv_floor, v: '+20', icon: '/_blob/43fa558226557cf0fb1cb061d1ae5b01' },
        { k: S.end_conv_boss, v: '+6', icon: '/_blob/b50617b22063bee244721d67b9d1c2e9' }
      ]
    };
  }
}
</script>
</body>
</html>
