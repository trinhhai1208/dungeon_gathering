<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lobby – sảnh</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&amp;family=Tiny5&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#efe6dc}a:hover{color:#f2b33d}
img{image-rendering:pixelated}
button{font:inherit;color:inherit;background:none;margin:0;padding:0;border:0;cursor:pointer}
@keyframes dg-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
.dg-bob{animation:dg-bob 0.8s steps(2,jump-none) infinite}
.f-dark,.f-dark-s,.f-dark-xs,.f-mid-s,.f-light,.f-light-s,.f-btn,.f-slot-s,.b-red,.b-blue,.b-grey,.b-green{border-style:solid;image-rendering:pixelated;box-sizing:border-box}
.f-dark{border-width:24px;border-image:url(/_blob/024dff5380443d6487e6f7e32a22dcf1) 24 fill / 24px stretch}
.f-dark-s{border-width:12px;border-image:url(/_blob/024dff5380443d6487e6f7e32a22dcf1) 24 fill / 12px stretch}
.f-dark-xs{border-width:8px;border-image:url(/_blob/024dff5380443d6487e6f7e32a22dcf1) 24 fill / 8px stretch}
.f-mid-s{border-width:12px;border-image:url(/_blob/98548f07bfaec0e750207463097f3048) 24 fill / 12px stretch}
.f-light{border-width:24px;border-image:url(/_blob/7d20ff926ea413b147f7dfb810cee5cd) 24 fill / 24px stretch}
.f-light-s{border-width:12px;border-image:url(/_blob/7d20ff926ea413b147f7dfb810cee5cd) 24 fill / 12px stretch}
.f-btn{border-width:24px;border-image:url(/_blob/3fa1daebff64e0db2fa846fc67ed87d9) 24 fill / 24px stretch}
.f-slot-s{border-width:12px;border-image:url(/_blob/52f45e9825703a936ced893a8ddc2f3a) 24 fill / 12px stretch}
.b-red{border-width:5px;border-image:url(/_blob/c1b35b498ddc61a89355e8ad126abaf5) 24 fill / 5px stretch}
.b-blue{border-width:5px;border-image:url(/_blob/d966e10699a9b9ac32772094f444e39c) 24 fill / 5px stretch}
.b-grey{border-width:5px;border-image:url(/_blob/adaf7a69949ba1d4299e134a7b9d7996) 24 fill / 5px stretch}
.b-green{border-width:5px;border-image:url(/_blob/f7e617e10b9c03c5768fe1621ab8f061) 24 fill / 5px stretch}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #1b1420; color: #efe6dc; font-family: {{font}}">
  <img src="/_blob/04bab72e16b654a735f8a8b35442374b" alt="{{tx.lobby_hall_alt}}" style="position: absolute; left: -8px; top: 0; width: 1296px; height: 720px">

  <sc-for list="{{chars}}" as="c" hint-placeholder-count="5">
    <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" aria-label="{{c.name}} – {{c.role}}" style="position: absolute; left: {{c.bx}}; top: {{c.by}}; width: 140px; height: 170px">
      <sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><img src="/_blob/02648f163e60916e18fb55160fcb2486" alt="" style="position: absolute; left: 30px; bottom: 6px; width: 80px; height: 40px"></sc-if>
      <img src="{{c.anim}}" alt="" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); height: {{c.h}}; opacity: {{c.op}}">
      <div style="position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: center">
        <sc-if value="{{c.arrow}}" hint-placeholder-val="{{ true }}"><img class="dg-bob" src="/_blob/d4f0e0a33d48422ef9afa856e75ccdec" alt="" style="height: 32px"></sc-if>
        <sc-if value="{{c.locked}}" hint-placeholder-val="{{ false }}"><span class="f-dark-xs" style="display: flex; align-items: center; gap: 4px; padding: 0 4px; height: 30px; font-size: 14px"><img src="/_blob/0f6ec1698dc6971c0a7fbf24da9d3abe" alt="" style="height: 14px">{{c.price}}</span></sc-if>
      </div>
      <span class="{{c.plate}}" style="position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); padding: 0 4px; height: 30px; display: flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 14px; color: {{c.fg}}"><img src="{{c.roleIcon}}" alt="" style="height: 14px">{{c.name}}</span>
    </button>
  </sc-for>

  <a href="UI-Shop.dc.html" aria-label="{{tx.lobby_merchant_alt}}" style="position: absolute; left: 96px; top: 70px; width: 130px; height: 132px; display: block; text-decoration: none">
    <span class="f-light-s" style="position: absolute; left: 50%; top: 0; transform: translateX(-50%); height: 32px; padding: 0 4px; display: flex; align-items: center; gap: 4px; white-space: nowrap; color: #1b1420; font-size: 14px"><img src="/_blob/0f6ec1698dc6971c0a7fbf24da9d3abe" alt="" style="height: 14px">{{tx.common_merchant}}</span>
  </a>
  <div class="f-dark-s" style="position: absolute; top: 14px; right: 20px; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 6px 0 2px">
    <img src="/_blob/0f6ec1698dc6971c0a7fbf24da9d3abe" alt="{{tx.common_coin}}" style="height: 26px">
    <span style="font-size: 22px">1,240</span>
  </div>

  <sc-if value="{{idle}}" hint-placeholder-val="{{ true }}">
    <a href="UI-Menu.dc.html" aria-label="{{tx.lobby_to_menu}}" style="position: absolute; top: 14px; left: 20px; display: block"><img src="/_blob/6c13802bc87c3805e6cc83316fd4567f" alt="" style="height: 52px; display: block"></a>
    <div class="f-dark-s" style="position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 2px 12px; font-size: 26px; letter-spacing: 2px; white-space: nowrap">{{tx.lobby_pick_char}}</div>
  </sc-if>

  <sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{close}}" aria-label="{{tx.lobby_close_info}}" style="position: absolute; top: 14px; left: 20px"><img src="/_blob/6c13802bc87c3805e6cc83316fd4567f" alt="" style="height: 52px; display: block"></button>
    <div class="f-dark" style="position: absolute; left: {{cur.px}}; top: 80px; width: 470px; height: 620px; padding: 0 4px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; gap: 14px; align-items: center">
        <div class="f-slot-s" style="width: 104px; height: 104px; flex: none; display: flex; align-items: flex-end; justify-content: center"><img src="{{cur.anim}}" alt="" style="height: {{cur.hPanel}}; opacity: {{cur.op}}"></div>
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
          <span style="font-size: 32px; line-height: 1">{{cur.name}}</span>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; letter-spacing: 1px"><img src="{{cur.roleIcon}}" alt="" style="height: 18px">{{cur.role}}</span>
          <span style="font-size: 13px; color: #ffd27a">{{cur.skill}}</span>
        </div>
      </div>
      <div style="font-size: 13px; line-height: 1.45; color: #e6e9f2">{{cur.desc}}</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 12px">
        <sc-for list="{{cur.bars}}" as="b" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 6px">
            <span style="width: 66px; font-size: 12px">{{b.label}}</span>
            <div class="f-dark-xs" style="flex: 1; height: 28px; position: relative">
              <div class="{{b.cls}}" style="height: 12px; width: {{b.pct}}"></div>
              <div style="position: absolute; inset: -6px 0; display: flex; align-items: center; justify-content: center; font-size: 13px; text-shadow: 0 1px 0 #1b1420">{{b.v}}</div>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; align-items: flex-end; gap: 2px">
        <sc-for list="{{cur.eq}}" as="e" hint-placeholder-count="6"><img src="{{e}}" alt="" style="width: 48px; display: block"></sc-for>
        <span style="width: 10px"></span>
        <sc-for list="{{cur.wp}}" as="w" hint-placeholder-count="2"><img src="{{w.img}}" alt="{{w.name}}" style="width: 48px; display: block"></sc-for>
      </div>
      <div style="font-size: 13px; color: #e6e9f2">{{tx.common_active}} <b style="color: #9fd0ff">{{cur.actN}}/2</b> · {{cur.acts}}</div>
      <sc-if value="{{cur.playable}}" hint-placeholder-val="{{ true }}">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <a href="UI-Equipment.dc.html" class="f-btn" style="height: 76px; display: flex; align-items: center; justify-content: center; gap: 8px; color: #1b1420; text-decoration: none; font-size: 20px"><img src="/_blob/e8fd9b7a47c41c2f6e238b61331ff390" alt="" style="height: 34px">{{tx.common_equip}}</a>
          <a href="UI-Weapon.dc.html" class="f-btn" style="height: 76px; display: flex; align-items: center; justify-content: center; gap: 8px; color: #1b1420; text-decoration: none; font-size: 20px"><img src="/_blob/984acd5e9f774c5ccbbced552ff90383" alt="" style="height: 34px">{{tx.common_weapons}}</a>
        </div>
        <a href="UI-HUD.dc.html" class="f-light" style="margin-top: auto; height: 76px; display: flex; align-items: center; justify-content: center; gap: 12px; color: #1b1420; text-decoration: none; font-size: 24px">{{tx.lobby_enter}}<img src="/_blob/22809a33cb74678617fb4dabe8444757" alt="" style="height: 32px"></a>
      </sc-if>
      <sc-if value="{{cur.locked}}" hint-placeholder-val="{{ false }}">
        <div style="font-size: 13px; color: #e6e9f2">{{tx.lobby_locked}}</div>
        <span class="f-light" style="margin-top: auto; height: 76px; display: flex; align-items: center; justify-content: center; gap: 10px; color: #1b1420; font-size: 24px">{{tx.lobby_unlock}} <img src="/_blob/0f6ec1698dc6971c0a7fbf24da9d3abe" alt="" style="height: 24px">{{cur.price}}</span>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["en","vi"],"default":"en"},"$preview":{"width":1280,"height":720}}'>
const STR = { "char_knight_desc": [ "Melee, heavy armor, slashes cut through basic bullets.", "Cận chiến, giáp dày, chém tan đạn thường." ], "char_knight_skill": [ "Dual Wield · 12s cooldown", "Dual Wield · hồi chiêu 12s" ], "char_paladin_desc": [ "Holy knight: thickest armor, slow.", "Kỵ sĩ thánh: giáp dày nhất, chậm." ], "char_ranger_desc": [ "Agile with high crit. Uses swords until ranged weapons arrive.", "Nhanh nhẹn, chí mạng cao. Tạm dùng kiếm cho đến khi có vũ khí tầm xa." ], "char_ranger_skill": [ "Dodge Roll · 4s cooldown", "Dodge Roll · hồi chiêu 4s" ], "char_rogue_desc": [ "Fast attacks, big crits, mobile.", "Tốc đánh cao, bạo kích, cơ động." ], "char_tbd": [ "[Skill TBD]", "[Skill chưa chốt]" ], "char_wizard_desc": [ "Elemental magic, lots of Mana, low HP.", "Phép nguyên tố, nhiều Mana, máu mỏng." ], "char_wizard_skill": [ "Arcane Storm · 15s cooldown", "Arcane Storm · hồi chiêu 15s" ], "common_active": [ "Active", "Kích hoạt" ], "common_coin": [ "Coin", "Coin" ], "common_empty": [ "Empty", "Trống" ], "common_equip": [ "EQUIP", "TRANG BỊ" ], "common_merchant": [ "MERCHANT", "THƯƠNG NHÂN" ], "common_weapons": [ "WEAPONS", "VŨ KHÍ" ], "lobby_close_info": [ "Close info, back to lobby", "Đóng thông tin, quay lại sảnh" ], "lobby_enter": [ "SELECT · ENTER PORTAL", "CHỌN · VÀO PORTAL" ], "lobby_hall_alt": [ "Lobby: portal, NPC counters, center table", "Sảnh: portal, quầy NPC, bàn giữa phòng" ], "lobby_locked": [ "Locked. Unlock with coins brought back from runs.", "Chưa mở khóa. Mở bằng coin mang về từ các run." ], "lobby_merchant_alt": [ "Merchant – open shop", "Thương nhân – mở cửa hàng" ], "lobby_no_active": [ "no item yet", "chưa có món nào" ], "lobby_pick_char": [ "CHOOSE A HERO TO START", "CHỌN NHÂN VẬT ĐỂ BẮT ĐẦU" ], "lobby_to_menu": [ "Back to menu", "Về menu" ], "lobby_unlock": [ "UNLOCK ·", "MỞ KHÓA ·" ], "skill_arcane_storm": [ "Arcane Storm", "Bão Phép" ], "skill_frost_field": [ "Frost Field", "Băng Trận" ], "skill_holy_light": [ "Holy Light", "Thánh Quang" ], "stat_armor": [ "Armor", "Giáp" ], "stat_dmg": [ "Damage", "Sát thương" ], "stat_hp": [ "HP", "Máu" ], "stat_mana": [ "Mana", "Mana" ], "sword_dark": [ "Dark Sword", "Kiếm Đen" ], "sword_holy": [ "Holy Sword", "Kiếm Thánh" ], "sword_ice": [ "Frost Sword", "Kiếm Băng" ], "sword_iron": [ "Iron Sword", "Kiếm Sắt" ], "sword_old": [ "Rotten Wood Sword", "Kiếm Gỗ Mục" ] };
class Component extends DCLogic {
  componentDidMount() {
    this._dgLang = () => this.forceUpdate();
    window.addEventListener('storage', this._dgLang);
    window.addEventListener('dg-lang', this._dgLang);
  }
  componentWillUnmount() {
    window.removeEventListener('storage', this._dgLang);
    window.removeEventListener('dg-lang', this._dgLang);
  }
  lang() {
    let v = null;
    try { v = window.localStorage.getItem('dg-lang'); } catch (e) {}
    return v === 'vi' || v === 'en' ? v : (this.props.lang === 'vi' ? 'vi' : 'en');
  }
  setLang(v) {
    try { window.localStorage.setItem('dg-lang', v); } catch (e) {}
    try { window.dispatchEvent(new Event('dg-lang')); } catch (e) {}
    this.forceUpdate();
  }
  font() { return this.lang() === 'vi' ? "'Tiny5', monospace" : "'Pixelify Sans', monospace"; }
  strs() {
    const i = this.lang() === 'vi' ? 1 : 0, o = {};
    Object.keys(STR).forEach(k => { o[k] = STR[k][i]; });
    return o;
  }

  constructor(p) { super(p); this.state = { picked: -1 }; }
  renderVals() {
    const S = this.strs();
    const RI = { WARRIOR: '/_blob/99c80cdd52c01dc18c8d675418d70347', RANGER: '/_blob/ff0e6af587cd37c8d5e171bae4517051', MAGE: '/_blob/84119a9343c0cb9d91f6cbfe7446b0ae', ASSASSIN: '/_blob/3f67213c67a39b302013b8d0bae91a18' };
    const EMPTY = ['/_blob/172889bebfd70fbd4af805b76ba90ebf', '/_blob/d1c9f95833810a6c39a3000af9b1a967', '/_blob/99098725ed349d21bb69972959971f05', '/_blob/38763d1dedc50d31f0515534d17a5c2c', '/_blob/c491269debf421041de0f971ee1b93e5', '/_blob/c4f097bea6fa36c81a280c331d32b849'];
    const KEQ = ['/_blob/7ffc1a1317705ba00a00a3429fc03a92', '/_blob/c53749c8a73f92a192d18c89bebe71e4', '/_blob/3b2479ad5a3406938c4332bace4c62e7', '/_blob/ff0663a6673101cad686807c05ac5011', EMPTY[4], '/_blob/d74730072c3d826fbcbf102a822c8485'];
    const SW = { iron: { name: S.sword_iron, img: '/_blob/c23b64f4ab8221b90c0a1070dbee108c' }, ice: { name: S.sword_ice, img: '/_blob/b7309a422bec545deda9d4104492539e' }, dark: { name: S.sword_dark, img: '/_blob/c93fc4324a0a8aa9f6270ac3279102a6' }, old: { name: S.sword_old, img: '/_blob/5fdfc102936c977fce08fa438cdb80fb' }, holy: { name: S.sword_holy, img: '/_blob/29671a62c2060dad79752491f17c1a8a' } };
    const NONE = { name: S.common_empty, img: '/_blob/f8a5b3547647c3396f6cea26aed916b1' };
    // x, y = feet position in the 1280×720 hall
    const data = [
      { name: 'Knight', role: 'WARRIOR', anim: '/_blob/91623d653ebf913d972612acd2846ecd', h: 64, x: 352, y: 380, skill: S.char_knight_skill, desc: S.char_knight_desc, hp: 80, armor: 6, mana: 120, atk: 14, eq: KEQ, wp: [SW.iron, SW.ice], acts: [S.skill_frost_field, S.skill_arcane_storm] },
      { name: 'Ranger', role: 'RANGER', anim: '/_blob/05959e0ad35ae8b0987fb9d278a8d1d1', h: 64, x: 520, y: 590, skill: S.char_ranger_skill, desc: S.char_ranger_desc, hp: 60, armor: 4, mana: 160, atk: 11, eq: EMPTY, wp: [SW.dark, NONE] },
      { name: 'Wizard', role: 'MAGE', anim: '/_blob/82c4b81731983273dc033fab4224bf0e', h: 60, x: 900, y: 440, skill: S.char_wizard_skill, desc: S.char_wizard_desc, hp: 50, armor: 4, mana: 220, atk: 16, eq: EMPTY, wp: [SW.old, NONE] },
      { name: 'Rogue', role: 'ASSASSIN', anim: '/_blob/93fe876a0cfc2f361b146e9a33bcce93', h: 64, x: 200, y: 600, skill: S.char_tbd, desc: S.char_rogue_desc, hp: 55, armor: 3, mana: 140, atk: 13, eq: EMPTY, wp: [SW.dark, NONE], price: 800 },
      { name: 'Paladin', role: 'WARRIOR', anim: '/_blob/758044bb2d9427a583a6774f4b265a00', h: 60, x: 1070, y: 580, skill: S.char_tbd, desc: S.char_paladin_desc, hp: 95, armor: 8, mana: 100, atk: 12, eq: EMPTY, wp: [SW.holy, NONE], acts: [S.skill_holy_light], price: 1500 }
    ];
    const i = this.state.picked;
    const pct = (v, m) => Math.round(v / m * 100) + '%';
    const chars = data.map((d, j) => ({
      ...d, roleIcon: RI[d.role], locked: !!d.price, arrow: !d.price && i < 0, on: j === i ? 'true' : 'false',
      op: d.price ? 0.55 : 1, h: d.h + 'px', bx: (d.x - 70) + 'px', by: (d.y - 146) + 'px',
      plate: j === i ? 'f-light-s' : 'f-dark-xs', fg: j === i ? '#1b1420' : '#efe6dc',
      pick: () => this.setState({ picked: j })
    }));
    const c = i >= 0 ? chars[i] : null;
    return { tx: S, font: this.font(),
      idle: i < 0, open: i >= 0, chars,
      close: () => this.setState({ picked: -1 }),
      cur: c ? { ...c, playable: !c.price, actN: (c.acts || []).length, acts: (c.acts || []).join(' · ') || S.lobby_no_active, hPanel: Math.round(data[i].h * 1.25) + 'px', px: data[i].x < 640 ? '786px' : '24px',
        bars: [
          { label: S.stat_hp, v: c.hp, pct: pct(c.hp, 100), cls: 'b-red' },
          { label: S.stat_armor, v: c.armor, pct: pct(c.armor, 10), cls: 'b-grey' },
          { label: S.stat_mana, v: c.mana, pct: pct(c.mana, 250), cls: 'b-blue' },
          { label: S.stat_dmg, v: c.atk, pct: pct(c.atk, 20), cls: 'b-green' }
        ] } : { bars: [], eq: [], wp: [] }
    };
  }
}
</script>
</body>
</html>
