<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Boss arena</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&amp;family=Pixelify+Sans:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
img{image-rendering:pixelated}
</style>
</helmet>
<div style="width: 1680px; height: 1100px; box-sizing: border-box; padding: 48px 56px; background: #1b1420; color: #efe6dc; font-family: 'Be Vietnam Pro', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; justify-content: space-between; align-items: flex-end">
    <h1 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-size: 52px; line-height: 1">Boss arena · Vampire Lord</h1>
    <div style="font-size: 15px; color: #b9a9b8">Crypt_Boss_25x19 · tile ×3</div>
  </div>
  <div style="display: flex; gap: 32px; align-items: flex-start">
    <img src="/_blob/69fd3e2b12de9cb7b73fc309d4feed9c" alt="Boss arena 25×19" style="width: 1200px; height: 912px; flex: none; border-radius: 4px">
    <div style="display: flex; flex-direction: column; gap: 18px; min-width: 0; flex: 1">
      <div style="padding: 16px; background: #2a1f2e; border: 2px solid #4d3a52; border-radius: 8px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; font-family: 'Pixelify Sans', monospace; font-size: 18px"><span>VAMPIRE LORD</span><span>58%</span></div>
        <div style="height: 18px; background: #1b1420; border: 2px solid #4d3a52; border-radius: 2px; position: relative; overflow: hidden">
          <div style="width: 58%; height: 100%; background: #c77dff"></div>
          <div style="position: absolute; left: 60%; top: 0; bottom: 0; width: 2px; background: #efe6dc"></div>
          <div style="position: absolute; left: 30%; top: 0; bottom: 0; width: 2px; background: #efe6dc"></div>
        </div>
        <div style="font-size: 12px; color: #c9bcc7">BossHealthBar trên HUD · vạch 60% / 30% = đổi phase</div>
      </div>
      <sc-for list="{{phases}}" as="p" hint-placeholder-count="3">
        <div style="padding: 16px; background: #2a1f2e; border: 2px solid {{p.c}}; border-radius: 8px; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-family: 'Pixelify Sans', monospace; font-size: 22px; color: {{p.c}}">{{p.name}}</span><span style="font-size: 13px; color: #c9bcc7">{{p.hp}}</span></div>
          <div style="font-size: 14px; line-height: 1.5; color: #e3d7e0">{{p.desc}}</div>
        </div>
      </sc-for>
      <div style="display: flex; align-items: center; gap: 12px; font-size: 14px; line-height: 1.45; color: #c9bcc7"><img src="/_blob/df2742cf2e6876398db89f26049c5264" alt="" style="height: 72px">Sprite vampire 16px phóng ×3. Cần animation riêng cho đòn Charge và Summon.</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1680,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      phases: [
        { name: 'Phase 1', hp: '100 → 60%', c: '#a9b5d0', desc: 'ShootAttack shotgun 5 viên + ChargeAttack có vạch đỏ cảnh báo 0.6s. ArrowTrap 2 bên bắn ngang mỗi 3s.' },
        { name: 'Phase 2', hp: '60 → 30%', c: '#f2b33d', desc: 'Bất tử 1s + gầm. SummonAttack gọi 2 Skull bay. Thêm bắn tỏa tròn 360° 12 viên.' },
        { name: 'Phase 3', hp: '30 → 0%', c: '#e0464b', desc: 'Tốc độ ×1.3. Hàng gai phía Nam bật chu kỳ nhanh, ép Player đánh ở giữa giữa 4 khối tường. Hạ Boss → Portal mở ở cửa Bắc.' }
      ]
    };
  }
}
</script>
</body>
</html>
