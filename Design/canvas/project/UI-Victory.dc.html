<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chiến thắng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&amp;family=Tiny5&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#efe6dc}a:hover{color:#f2b33d}
img{image-rendering:pixelated}
.f-dark,.f-dark-s,.f-mid-s,.f-light,.f-light-s,.f-btn,.f-slot-s{border-style:solid;image-rendering:pixelated;box-sizing:border-box}
.f-dark{border-width:24px;border-image:url(/_blob/024dff5380443d6487e6f7e32a22dcf1) 24 fill / 24px stretch}
.f-dark-s{border-width:12px;border-image:url(/_blob/024dff5380443d6487e6f7e32a22dcf1) 24 fill / 12px stretch}
.f-mid-s{border-width:12px;border-image:url(/_blob/98548f07bfaec0e750207463097f3048) 24 fill / 12px stretch}
.f-light{border-width:24px;border-image:url(/_blob/7d20ff926ea413b147f7dfb810cee5cd) 24 fill / 24px stretch}
.f-light-s{border-width:12px;border-image:url(/_blob/7d20ff926ea413b147f7dfb810cee5cd) 24 fill / 12px stretch}
.f-btn{border-width:24px;border-image:url(/_blob/3fa1daebff64e0db2fa846fc67ed87d9) 24 fill / 24px stretch}
.f-slot-s{border-width:12px;border-image:url(/_blob/52f45e9825703a936ced893a8ddc2f3a) 24 fill / 12px stretch}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #1b1420; color: #efe6dc; font-family: {{font}}">
  <img src="/_blob/69fd3e2b12de9cb7b73fc309d4feed9c" alt="" style="position: absolute; left: 40px; top: -96px; width: 1200px; height: 912px; opacity: 0.45">
  <div style="position: absolute; inset: 0; background: rgba(27,20,32,0.55)"></div>

  <div style="position: absolute; left: 0; right: 0; top: 26px; display: flex; justify-content: center; align-items: center; gap: 28px">
    <img src="/_blob/54c298188a3ca1b4eb14f5c9f1bf6a21" alt="" style="height: 112px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <div style="font-size: 18px; letter-spacing: 4px; color: #ffd27a">{{tx.win_sub}}</div>
      <h1 style="margin: 0; font-size: 76px; line-height: 1; color: #ffd27a; text-shadow: 0 5px 0 #7a4a12">{{tx.win_title}}</h1>
      <div style="display: flex; align-items: center; gap: 10px; font-size: 16px; color: #efe6dc"><img src="/_blob/b50617b22063bee244721d67b9d1c2e9" alt="" style="height: 34px">{{tx.win_defeated}} <b style="color: #ffd27a">Vampire Lord</b> · Knight · Warrior</div>
    </div>
    <img src="/_blob/a6da3b9950d5a992620f714f4ff8cf3e" alt="" style="height: 96px">
  </div>

  <div style="position: absolute; left: 100px; right: 100px; top: 214px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px">
    <div class="f-dark" style="padding: 4px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
          <div class="f-mid-s" style="display: flex; flex-direction: column; gap: 2px; padding: 2px 4px; color: #1b1420">
            <div style="font-size: 13px">{{s.k}}</div>
            <div style="font-size: 28px">{{s.v}}</div>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; gap: 8px">
        <span class="f-light-s" style="padding: 0 8px; font-size: 14px; color: #1b1420">{{tx.win_first}}</span>
        <span class="f-light-s" style="padding: 0 8px; font-size: 14px; color: #1b1420">{{tx.win_record}}</span>
        <span class="f-dark-s" style="padding: 0 8px; font-size: 13px">{{tx.win_continue_note}}</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: #e6e9f2">{{tx.win_chest}}</div>
        <div style="display: flex; gap: 8px">
          <sc-for list="{{loot}}" as="l" hint-placeholder-count="5">
            <div style="position: relative">
              <img src="{{l.img}}" alt="{{l.name}}" style="width: 64px; display: block">
              <img src="{{l.let}}" alt="" style="position: absolute; left: 4px; top: 4px; width: 14px; height: 16px">
            </div>
          </sc-for>
        </div>
      </div>
    </div>
    <div class="f-dark" style="padding: 4px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: #e6e9f2">{{tx.win_coin_if}}</div>
      <sc-for list="{{conv}}" as="c" hint-placeholder-count="4">
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 15px">
          <span style="display: flex; align-items: center; gap: 10px"><img src="{{c.icon}}" alt="" style="height: 26px; width: 26px; object-fit: contain">{{c.k}}</span>
          <span style="font-size: 20px">{{c.v}}</span>
        </div>
      </sc-for>
      <div class="f-light-s" style="display: flex; justify-content: space-between; align-items: center; padding: 0 6px; margin-top: auto; color: #1b1420">
        <span style="font-size: 16px">{{tx.common_total}}</span>
        <span style="display: flex; align-items: center; gap: 8px; font-size: 34px"><img src="/_blob/0f6ec1698dc6971c0a7fbf24da9d3abe" alt="" style="height: 30px">+346</span>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 30px; display: flex; justify-content: center; gap: 20px">
    <a href="UI-Lobby.dc.html" class="f-btn" style="display: flex; align-items: center; gap: 10px; height: 76px; padding: 0 12px; color: #1b1420; text-decoration: none; font-size: 24px">{{tx.win_to_lobby}}</a>
    <a href="UI-HUD.dc.html" class="f-light" style="display: flex; align-items: center; gap: 10px; height: 76px; padding: 0 12px; color: #1b1420; text-decoration: none; font-size: 24px">{{tx.win_next}}<img src="/_blob/22809a33cb74678617fb4dabe8444757" alt="" style="height: 30px"></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["en","vi"],"default":"en"},"$preview":{"width":1280,"height":720}}'>
const STR = { "common_total": [ "Total", "Tổng nhận" ], "item_fire_armor": [ "Flame Knight Armor", "Giáp Lửa Kỵ Sĩ" ], "item_night_gloves": [ "Nightshade Gloves", "Găng Tay Bóng Đêm" ], "item_rune_book": [ "Ancient Rune Book", "Sách Cổ Ngữ" ], "stat_floor": [ "Floor", "Tầng" ], "stat_kills": [ "Kills", "Hạ quái" ], "stat_rooms": [ "Rooms cleared", "Phòng clear" ], "stat_time": [ "Time", "Thời gian" ], "sword_fire": [ "Flame Sword", "Kiếm Lửa" ], "sword_void": [ "Void Sword", "Kiếm Hư Không" ], "win_chest": [ "Boss chest · into bag, swap in lobby", "Rương Boss · vào túi, thay ở sảnh" ], "win_coin_if": [ "Coins if you return to lobby", "Coin mang về nếu về sảnh" ], "win_continue_note": [ "Continue: keep run gear & coins, stronger enemies", "Tiếp tục: giữ đồ & coin của run, quái mạnh hơn" ], "win_conv_boss": [ "Boss defeated", "Hạ Boss" ], "win_conv_first": [ "First Boss kill on floor 3", "Lần đầu hạ Boss tầng 3" ], "win_conv_floor": [ "Floor bonus (3 floors × 20)", "Thưởng tầng (3 tầng × 20)" ], "win_conv_run": [ "Run coins 860 × 10%", "Coin gom trong run 860 × 10%" ], "win_defeated": [ "Defeated", "Đã hạ" ], "win_first": [ "FIRST CLEAR", "LẦN ĐẦU CLEAR" ], "win_next": [ "CONTINUE · FLOOR 4", "TIẾP TỤC · TẦNG 4" ], "win_record": [ "RECORD 14:32", "KỶ LỤC 14:32" ], "win_sub": [ "BOSS DEFEATED · FLOOR 3", "ĐÃ HẠ BOSS · TẦNG 3" ], "win_title": [ "VICTORY!", "CHIẾN THẮNG!" ], "win_to_lobby": [ "TO LOBBY · +346", "VỀ SẢNH · NHẬN +346" ] };
class Component extends DCLogic {
  componentDidMount() {
    this._dgLang = () => this.forceUpdate();
    window.addEventListener('storage', this._dgLang);
    window.addEventListener('dg-lang', this._dgLang);
  }
  componentWillUnmount() {
    window.removeEventListener('storage', this._dgLang);
    window.removeEventListener('dg-lang', this._dgLang);
  }
  lang() {
    let v = null;
    try { v = window.localStorage.getItem('dg-lang'); } catch (e) {}
    return v === 'vi' || v === 'en' ? v : (this.props.lang === 'vi' ? 'vi' : 'en');
  }
  setLang(v) {
    try { window.localStorage.setItem('dg-lang', v); } catch (e) {}
    try { window.dispatchEvent(new Event('dg-lang')); } catch (e) {}
    this.forceUpdate();
  }
  font() { return this.lang() === 'vi' ? "'Tiny5', monospace" : "'Pixelify Sans', monospace"; }
  strs() {
    const i = this.lang() === 'vi' ? 1 : 0, o = {};
    Object.keys(STR).forEach(k => { o[k] = STR[k][i]; });
    return o;
  }

  renderVals() {
    const S = this.strs();
    const LET = { S: '/_blob/c04911b55cda3c35c672b6de5b2608de', A: '/_blob/5ab2dfa420835a27a80274756ebe07c6', B: '/_blob/520ce0ed0fca6b027f29471e6726bc28', C: '/_blob/6ce73af3c47c07ecb1e4177b5049d482', F: '/_blob/2a8c8dbb1a05c4b01ac9490c5e4f0ce1' };
    const loot = [
      { name: S.sword_fire, rar: 'S', img: '/_blob/80806e9fc35f81456a89617880fd4176' },
      { name: S.sword_void, rar: 'A', img: '/_blob/8754d4b075f4006a02c3a5d853d5d553' },
      { name: S.item_fire_armor, rar: 'A', img: '/_blob/c53749c8a73f92a192d18c89bebe71e4' },
      { name: S.item_night_gloves, rar: 'A', img: '/_blob/3b2479ad5a3406938c4332bace4c62e7' },
      { name: S.item_rune_book, rar: 'B', img: '/_blob/d74730072c3d826fbcbf102a822c8485' }
    ];
    return { tx: S, font: this.font(),
      stats: [ { k: S.stat_floor, v: '3-5' }, { k: S.stat_time, v: '14:32' }, { k: S.stat_kills, v: '86' }, { k: S.stat_rooms, v: '15' } ],
      loot: loot.map(l => ({ ...l, let: LET[l.rar] })),
      conv: [
        { k: S.win_conv_run, v: '+86', icon: '/_blob/0f6ec1698dc6971c0a7fbf24da9d3abe' },
        { k: S.win_conv_floor, v: '+60', icon: '/_blob/43fa558226557cf0fb1cb061d1ae5b01' },
        { k: S.win_conv_boss, v: '+100', icon: '/_blob/b50617b22063bee244721d67b9d1c2e9' },
        { k: S.win_conv_first, v: '+100', icon: '/_blob/54c298188a3ca1b4eb14f5c9f1bf6a21' }
      ]
    };
  }
}
</script>
</body>
</html>
