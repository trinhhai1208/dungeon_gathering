<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&amp;family=Tiny5&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#efe6dc}a:hover{color:#f2b33d}
img{image-rendering:pixelated}
button{font:inherit;color:inherit;background:none;margin:0;padding:0;border:0;cursor:pointer}
.f-dark-s,.f-light,.f-light-s,.b-green{border-style:solid;image-rendering:pixelated;box-sizing:border-box}
.f-dark-s{border-width:12px;border-image:url(/_blob/024dff5380443d6487e6f7e32a22dcf1) 24 fill / 12px stretch}
.f-light{border-width:24px;border-image:url(/_blob/7d20ff926ea413b147f7dfb810cee5cd) 24 fill / 24px stretch}
.f-light-s{border-width:12px;border-image:url(/_blob/7d20ff926ea413b147f7dfb810cee5cd) 24 fill / 12px stretch}
.b-green{border-width:6px;border-image:url(/_blob/f7e617e10b9c03c5768fe1621ab8f061) 24 fill / 6px stretch}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #1b1420; color: #efe6dc; font-family: {{font}}">
  <img src="/_blob/ce787f1be330a75494d85f0178b1eb8d" alt="" style="position: absolute; left: 0; top: 0; width: 1280px; height: 720px">
  <div style="position: absolute; inset: 0; background: rgba(27,20,32,0.25)"></div>

  <div style="position: absolute; left: 0; right: 0; top: 108px; display: flex; flex-direction: column; align-items: center; gap: 8px">
    <div style="display: flex; gap: 16px; align-items: flex-end">
      <img src="/_blob/45c9ef46ac8c484c994e2d44554ee18c" alt="" style="height: 52px">
      <h1 style="margin: 0; font-size: 88px; line-height: 0.9; color: #f2b33d; text-shadow: 0 6px 0 #6b3f1e">DUNGEON</h1>
      <img src="/_blob/45c9ef46ac8c484c994e2d44554ee18c" alt="" style="height: 52px">
    </div>
    <div style="font-size: 52px; letter-spacing: 9px; color: #efe6dc; text-shadow: 0 5px 0 #4d3a52">GATHERING</div>
  </div>

  <sc-if value="{{loading}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 280px; top: 392px; width: 720px; height: 76px">
      <img src="/_blob/91623d653ebf913d972612acd2846ecd" alt="" style="position: absolute; bottom: 0; left: {{knightX}}; width: 64px; height: 68px">
    </div>
    <div class="f-dark-s" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{pct}}" aria-label="{{tx.common_loading}}" style="position: absolute; left: 280px; top: 468px; width: 720px; height: 44px; padding: 4px">
      <div class="b-green" style="height: 100%; width: {{barW}}"></div>
    </div>
    <div style="position: absolute; left: 280px; top: 524px; width: 720px; display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 20px">{{step}}</span>
      <span style="font-size: 24px; color: #f2b33d">{{pct}}%</span>
    </div>
    <div style="position: absolute; left: 280px; top: 556px; width: 720px; display: flex; justify-content: space-between; font-size: 14px; color: #c9cdd8">
      <span>{{tx.loading_first_time}}</span>
      <span>{{mb}} MB</span>
    </div>
  </sc-if>

  <sc-if value="{{error}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 280px; top: 410px; width: 720px; display: flex; flex-direction: column; align-items: center; gap: 18px">
      <div class="f-dark-s" style="padding: 4px 14px; font-size: 20px; color: #ff8a84; text-align: center">{{tx.loading_error}}</div>
      <button type="button" class="f-light" onClick="{{retry}}" style="height: 72px; padding: 0 20px; display: flex; align-items: center; color: #1b1420; font-size: 24px">{{tx.loading_retry}}</button>
    </div>
  </sc-if>

  <div class="f-dark-s" style="position: absolute; left: 220px; right: 220px; bottom: 44px; display: flex; align-items: center; gap: 12px; padding: 2px 10px">
    <span class="f-light-s" style="flex: none; padding: 0 6px; height: 32px; display: flex; align-items: center; color: #1b1420; font-size: 14px">{{tx.loading_tip_label}}</span>
    <span style="font-size: 16px; line-height: 1.35">{{tip}}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["en","vi"],"default":"en"},"state":{"editor":"enum","options":["loading","error"],"default":"loading"},"$preview":{"width":1280,"height":720}}'>
const STR = {"common_loading": ["Loading…", "Đang tải…"], "loading_step_engine": ["Loading game engine", "Đang tải engine game"], "loading_step_core": ["Loading core data", "Đang tải dữ liệu chung"], "loading_step_ui": ["Loading interface", "Đang tải giao diện"], "loading_step_menu": ["Preparing the menu", "Đang chuẩn bị màn chính"], "loading_done": ["Ready!", "Sẵn sàng!"], "loading_tip_label": ["TIP", "MẸO"], "loading_tip1": ["Gear found in the dungeon goes to your bag. Swap it in the lobby.", "Đồ nhặt trong dungeon vào túi. Thay đồ ở sảnh."], "loading_tip2": ["A run can carry at most 2 items with active skills.", "Mỗi run chỉ mang tối đa 2 món có kỹ năng kích hoạt."], "loading_tip3": ["Gear matching your hero's Role unlocks a bonus passive.", "Trang bị đúng Role của nhân vật sẽ kích hoạt hiệu ứng thêm."], "loading_error": ["Could not load the game. Check your connection.", "Không tải được game. Kiểm tra kết nối mạng."], "loading_retry": ["RETRY", "THỬ LẠI"], "loading_first_time": ["First load may take a moment. Next time is faster.", "Lần đầu tải có thể hơi lâu. Lần sau sẽ nhanh hơn."]};
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { p: 0, tick: 0, retried: false }; }
  componentDidMount() {
    this._dgLang = () => this.forceUpdate();
    window.addEventListener('storage', this._dgLang);
    window.addEventListener('dg-lang', this._dgLang);
    // Simulated download: 0 → 100%, hold, restart. In the game this comes from IDownloadService progress.
    this._timer = setInterval(() => {
      const t = this.state.tick + 1;
      const p = t > 95 ? 100 : Math.min(100, Math.round(t * 1.15));
      this.setState({ tick: t > 110 ? 0 : t, p: t > 110 ? 0 : p });
    }, 90);
  }
  componentWillUnmount() {
    clearInterval(this._timer);
    window.removeEventListener('storage', this._dgLang);
    window.removeEventListener('dg-lang', this._dgLang);
  }
  lang() {
    let v = null;
    try { v = window.localStorage.getItem('dg-lang'); } catch (e) {}
    return v === 'vi' || v === 'en' ? v : (this.props.lang === 'vi' ? 'vi' : 'en');
  }
  font() { return this.lang() === 'vi' ? "'Tiny5', monospace" : "'Pixelify Sans', monospace"; }
  strs() {
    const i = this.lang() === 'vi' ? 1 : 0, o = {};
    Object.keys(STR).forEach(k => { o[k] = STR[k][i]; });
    return o;
  }
  renderVals() {
    const S = this.strs();
    const p = this.state.p;
    const err = (this.props.state ?? 'loading') === 'error' && !this.state.retried;
    const step = p >= 100 ? S.loading_done : p < 35 ? S.loading_step_engine : p < 60 ? S.loading_step_core : p < 85 ? S.loading_step_ui : S.loading_step_menu;
    const tips = [S.loading_tip1, S.loading_tip2, S.loading_tip3];
    return { tx: S, font: this.font(),
      loading: !err, error: err,
      pct: p, barW: p + '%', knightX: Math.round(p / 100 * 656) + 'px',
      step, mb: (p / 100 * 14.8).toFixed(1) + ' / 14.8',
      tip: tips[Math.floor(this.state.tick / 40) % tips.length],
      retry: () => this.setState({ retried: true, tick: 0, p: 0 })
    };
  }
}
</script>
</body>
</html>
