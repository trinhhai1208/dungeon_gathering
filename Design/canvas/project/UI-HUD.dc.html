<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Play HUD</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&amp;family=Tiny5&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#efe6dc}a:hover{color:#f2b33d}
img{image-rendering:pixelated}
button{font:inherit;color:inherit;background:none;margin:0;padding:0;border:0;cursor:pointer}
.f-dark,.f-dark-s,.f-dark-xs,.f-slot-s,.b-red,.b-blue,.b-grey{border-style:solid;image-rendering:pixelated;box-sizing:border-box}
.f-dark{border-width:24px;border-image:url(/_blob/024dff5380443d6487e6f7e32a22dcf1) 24 fill / 24px stretch}
.f-dark-s{border-width:12px;border-image:url(/_blob/024dff5380443d6487e6f7e32a22dcf1) 24 fill / 12px stretch}
.f-dark-xs{border-width:8px;border-image:url(/_blob/024dff5380443d6487e6f7e32a22dcf1) 24 fill / 8px stretch}
.f-slot-s{border-width:12px;border-image:url(/_blob/52f45e9825703a936ced893a8ddc2f3a) 24 fill / 12px stretch}
.b-red{border-width:4px;border-image:url(/_blob/c1b35b498ddc61a89355e8ad126abaf5) 24 fill / 4px stretch}
.b-blue{border-width:4px;border-image:url(/_blob/d966e10699a9b9ac32772094f444e39c) 24 fill / 4px stretch}
.b-grey{border-width:4px;border-image:url(/_blob/adaf7a69949ba1d4299e134a7b9d7996) 24 fill / 4px stretch}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #1b1420; color: #efe6dc; font-family: {{font}}">
  <img src="/_blob/1e99563c5c5f5bd4e09f4c4a3cbfdea0" alt="{{tx.hud_room_alt}}" style="position: absolute; left: 32px; top: -60px; width: 1216px; height: 960px">

  <img src="/_blob/0bdcb5c848ab1884a371d1b7db49622b" alt="" style="position: absolute; left: 196px; top: 290px; width: 128px; height: 128px">
  <img src="/_blob/02648f163e60916e18fb55160fcb2486" alt="" style="position: absolute; left: 592px; top: 92px; width: 96px; height: 96px">
  <div style="position: absolute; left: 660px; top: 64px; font-size: 30px; color: #ffffff; text-shadow: 0 3px 0 #1b1420">14</div>
  <div style="position: absolute; left: 1040px; top: 40px; font-size: 38px; color: #f2b33d; text-shadow: 0 3px 0 #1b1420">28!</div>

  <div class="f-dark-s" style="position: absolute; top: 10px; left: 10px; padding: 0 2px; display: flex; gap: 8px; align-items: center">
    <div class="f-slot-s" style="width: 60px; height: 60px; display: flex; align-items: flex-end; justify-content: center"><img src="/_blob/74e8cf0ba507499ee8499fb411e8c035" alt="Knight" style="height: 30px"></div>
    <div style="display: flex; flex-direction: column; gap: 1px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 4px">
          <img src="{{b.icon}}" alt="{{b.label}}" style="height: 14px; width: 16px; object-fit: contain">
          <div class="f-dark-xs" style="width: 150px; height: 24px; position: relative">
            <div class="{{b.cls}}" style="height: 8px; width: {{b.pct}}"></div>
            <div style="position: absolute; inset: -4px 0; display: flex; align-items: center; justify-content: center; font-size: 12px; text-shadow: 0 1px 0 #1b1420">{{b.text}}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; top: 112px; left: 10px; display: flex; gap: 6px">
    <div class="f-dark-xs" style="display: flex; align-items: center; gap: 6px; padding: 0 4px; height: 34px; font-size: 16px"><img src="/_blob/0f6ec1698dc6971c0a7fbf24da9d3abe" alt="{{tx.common_coin}}" style="height: 16px">86</div>
    <div class="f-dark-xs" style="display: flex; align-items: center; padding: 0 6px; height: 34px; font-size: 16px">{{tx.hud_floor}}</div>
  </div>

  <div style="position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; align-items: flex-start">
    <div class="f-dark" style="width: 176px; height: 130px; position: relative">
      <sc-for list="{{mini}}" as="r" hint-placeholder-count="6">
        <img src="{{r.src}}" alt="" style="position: absolute; left: {{r.x}}; top: {{r.y}}; width: 24px; height: 21px">
      </sc-for>
    </div>
    <a href="UI-Pause.dc.html" aria-label="{{tx.hud_pause}}" style="display: block"><img src="/_blob/02181e9b6d8077e746a9780a8245dae6" alt="" style="height: 60px; display: block"></a>
  </div>

  <div style="position: absolute; left: 48px; bottom: 40px; width: 160px; height: 160px">
    <img src="/_blob/028095d3d052e60fc27981e798d647b6" alt="{{tx.hud_joystick}}" style="position: absolute; inset: 0; width: 160px; height: 160px; opacity: 0.9">
    <img src="/_blob/b0104af4d58ea5269e8a2a2895aa8b87" alt="" style="position: absolute; left: 62px; top: 30px; width: 80px; height: 80px">
  </div>

  <div style="position: absolute; right: 28px; bottom: 28px; width: 330px; height: 250px">
    <img src="/_blob/a67d75e6b461819078b892b91ccccd2e" alt="{{tx.hud_attack}}" style="position: absolute; right: 0; bottom: 0; height: 132px">
    <sc-for list="{{acts}}" as="a" hint-placeholder-count="2">
      <button type="button" aria-label="{{a.name}}" style="position: absolute; right: {{a.r}}; bottom: {{a.b}}; display: block">
        <img src="{{a.img}}" alt="" style="width: {{a.w}}; display: block; opacity: {{a.op}}">
        <sc-if value="{{a.cd}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #ffffff; text-shadow: 0 3px 0 #1b1420">{{a.cd}}</span></sc-if>
      </button>
    </sc-for>
    <button type="button" onClick="{{swap}}" aria-label="{{tx.hud_swap}} {{w.name}}" style="position: absolute; right: 138px; bottom: 112px; display: flex; flex-direction: column; align-items: center; gap: 2px">
      <span style="position: relative; display: block">
        <img src="{{w.img}}" alt="" style="width: 72px; display: block">
        <img src="/_blob/f4a133e2814bd816130ed7fd8430a7c7" alt="" style="position: absolute; left: -10px; top: -10px; width: 32px; height: 32px">
      </span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["en","vi"],"default":"en"},"$preview":{"width":1280,"height":720}}'>
const STR = { "common_coin": [ "Coin", "Coin" ], "hud_act1": [ "Frost Field (Frost Sword) · 9s", "Băng Trận (Kiếm Băng) · hồi 9s" ], "hud_act2": [ "Arcane Storm (Rune Book) · ready", "Bão Phép (Sách Cổ Ngữ) · sẵn sàng" ], "hud_attack": [ "Attack", "Tấn công" ], "hud_floor": [ "FLOOR 1-3", "TẦNG 1-3" ], "hud_joystick": [ "Movement joystick", "Joystick di chuyển" ], "hud_pause": [ "Pause", "Tạm dừng" ], "hud_room_alt": [ "Combat room, doors locked", "Phòng Combat đang khóa cửa" ], "hud_swap": [ "Swap weapon, holding", "Đổi vũ khí, đang cầm" ], "stat_armor": [ "Armor", "Giáp" ], "stat_hp": [ "HP", "Máu" ], "stat_mana": [ "Mana", "Mana" ], "sword_ice": [ "Frost Sword", "Kiếm Băng" ], "sword_iron": [ "Iron Sword", "Kiếm Sắt" ] };
class Component extends DCLogic {
  componentDidMount() {
    this._dgLang = () => this.forceUpdate();
    window.addEventListener('storage', this._dgLang);
    window.addEventListener('dg-lang', this._dgLang);
  }
  componentWillUnmount() {
    window.removeEventListener('storage', this._dgLang);
    window.removeEventListener('dg-lang', this._dgLang);
  }
  lang() {
    let v = null;
    try { v = window.localStorage.getItem('dg-lang'); } catch (e) {}
    return v === 'vi' || v === 'en' ? v : (this.props.lang === 'vi' ? 'vi' : 'en');
  }
  setLang(v) {
    try { window.localStorage.setItem('dg-lang', v); } catch (e) {}
    try { window.dispatchEvent(new Event('dg-lang')); } catch (e) {}
    this.forceUpdate();
  }
  font() { return this.lang() === 'vi' ? "'Tiny5', monospace" : "'Pixelify Sans', monospace"; }
  strs() {
    const i = this.lang() === 'vi' ? 1 : 0, o = {};
    Object.keys(STR).forEach(k => { o[k] = STR[k][i]; });
    return o;
  }

  constructor(p) { super(p); this.state = { w: 0 }; }
  renderVals() {
    const S = this.strs();
    const W = '/_blob/da08957845af8b412ad40c26cdca6a75', L = '/_blob/1a4adea2c28f5436ab190aa0841903e4', G = '/_blob/64d5edfdd86238a6f7bdd2bf59e93d79';
    const cell = (cx, cy, src) => ({ x: (4 + cx * 30) + 'px', y: (2 + cy * 28) + 'px', src });
    const weapons = [
      { name: S.sword_iron, img: '/_blob/c23b64f4ab8221b90c0a1070dbee108c' },
      { name: S.sword_ice, img: '/_blob/b7309a422bec545deda9d4104492539e' }
    ];
    return { tx: S, font: this.font(),
      w: weapons[this.state.w],
      acts: [
        { name: S.hud_act1, img: '/_blob/b7309a422bec545deda9d4104492539e', cd: '9', op: 0.45, r: '142px', b: '0', w: '88px' },
        { name: S.hud_act2, img: '/_blob/d74730072c3d826fbcbf102a822c8485', cd: '', op: 1, r: '26px', b: '150px', w: '76px' }
      ],
      swap: () => this.setState({ w: 1 - this.state.w }),
      bars: [
        { label: S.stat_hp, icon: '/_blob/7f291a6b43834e728c7d1689733764f0', cls: 'b-red', pct: '80%', text: '72/90' },
        { label: S.stat_armor, icon: '/_blob/1a179e1414f11723382e9d05fca109f1', cls: 'b-grey', pct: '33%', text: '3/9' },
        { label: S.stat_mana, icon: '/_blob/4aa2e9d4d44e174268ae9b157b554723', cls: 'b-blue', pct: '79%', text: '118/150' }
      ],
      mini: [cell(0, 1, L), cell(1, 1, L), cell(2, 1, W), cell(1, 2, L), cell(2, 0, G), cell(2, 2, G)]
    };
  }
}
</script>
</body>
</html>
